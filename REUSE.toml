version = 1
SPDX-PackageName = "Micelio themes"
SPDX-PackageDownloadLocation = "https://github.com/bogd3v/micelio-themes"

# Licensing of every file, by path (REUSE specification 3.3), as in REUSE.toml of bogd3v/micelio (ADR 0007).
# Later annotations win over earlier ones. Unlike the core, this repository has no theme exception: the official themes are plain AGPL-3.0-only
# (`license` in each theme.json). THIRD-PARTY.md explains the third-party entries.

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Alejandro Ramirez Garcia and the Micelio contributors"
SPDX-License-Identifier = "AGPL-3.0-only"

# Fonts and their license texts
[[annotations]]
path = ["themes/bogota/fonts/archivo-latin-var.woff2", "themes/bogota/fonts/OFL-Archivo.txt"]
SPDX-FileCopyrightText = "The Archivo Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["themes/bogota/fonts/jetbrains-mono-latin-var.woff2", "themes/bogota/fonts/OFL-JetBrainsMono.txt"]
SPDX-FileCopyrightText = "The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Photo of the Sumapaz páramo by Danielfjio (Wikimedia Commons), cropped and color graded
[[annotations]]
path = "themes/bogota/images/hero/sumapaz-*.jpg"
SPDX-FileCopyrightText = ["Danielfjio", "2026 Alejandro Ramirez Garcia (modifications)"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Visual baselines of the Bogotá theme render that photo
[[annotations]]
path = "__screenshots__/bogota/**"
SPDX-FileCopyrightText = ["2026 Alejandro Ramirez Garcia and the Micelio contributors", "Danielfjio"]
SPDX-License-Identifier = "AGPL-3.0-only AND CC-BY-SA-4.0"
