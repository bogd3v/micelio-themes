name: Snapshots

# Renders the visual baselines in the Playwright image of the core and uploads them as admission-snapshots-<id>; nothing is committed
# (docs/themes/publishing-a-theme.md of bogd3v/micelio, section 6). Review the images, unzip them into __screenshots__/<id>/ and commit.
# Pinned to one core commit (1288a69, until v0.10.0 is tagged): replace 1288a69 and core-ref together with the other workflows.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  snapshots:
    uses: bogd3v/micelio/.github/workflows/theme-snapshots.yml@1288a692161351f3c439e4965d5ad846c152ca8d
    with:
      theme-dirs: themes
      core-ref: 1288a692161351f3c439e4965d5ad846c152ca8d
    permissions:
      contents: read
