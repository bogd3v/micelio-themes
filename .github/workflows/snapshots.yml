name: Snapshots

# Renders the visual baselines in the Playwright image of the core and uploads them as admission-snapshots-<id>; nothing is committed
# (docs/themes/publishing-a-theme.md of bogd3v/micelio, section 6). Review the images, unzip them into __screenshots__/<id>/ and commit.
# Pinned to one core commit (93b9459, until v0.9.0 is tagged): replace 93b9459 and core-ref together with the other workflows.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  snapshots:
    uses: bogd3v/micelio/.github/workflows/theme-snapshots.yml@93b9459ad55e65aeecde3e288ce6e3ef916218e5
    with:
      theme-dirs: themes
      core-ref: 93b9459ad55e65aeecde3e288ce6e3ef916218e5
    permissions:
      contents: read
